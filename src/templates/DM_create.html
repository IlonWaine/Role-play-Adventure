<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM Story Builder & Campaign Manager</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0d0f12;
      --bg-card: #161920;
      --bg-element: #1f242d;
      --bg-input: #12151c;
      --border-color: #2d3748;
      --accent-gold: #d97706;
      --accent-gold-hover: #b45309;
      --accent-red: #991b1b;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-card); }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .header-title-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .adventure-title-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--accent-gold);
      font-size: 1.25rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      width: 60%;
      transition: all 0.2s;
    }

    .adventure-title-input:hover, .adventure-title-input:focus {
      border-color: var(--border-color);
      background-color: var(--bg-input);
      outline: none;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-gold { background-color: var(--accent-gold); color: #000; }
    .btn-gold:hover { background-color: var(--accent-gold-hover); }

    .btn-outline { background-color: transparent; color: var(--accent-gold); border-color: var(--accent-gold); }
    .btn-outline:hover { background-color: rgba(217, 119, 6, 0.1); }

    .btn-danger { background-color: transparent; color: #ef4444; border-color: #ef4444; }
    .btn-danger:hover { background-color: rgba(239, 68, 68, 0.1); }

    .btn-dark { background-color: var(--bg-element); color: var(--text-main); border-color: var(--border-color); }
    .btn-dark:hover { background-color: #2a303c; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; overflow-y: auto; }
      body { overflow: auto; }
    }

    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .panel-header {
      padding: 12px 16px;
      background-color: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input, textarea {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    /* DRAG & DROP STYLES */
    .dragging { opacity: 0.4; }
    .drag-handle { cursor: grab; color: var(--text-muted); padding: 2px 6px; }
    .drag-handle:active { cursor: grabbing; }

    /* DROPZONE FOR IMAGES */
    .image-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background-color: var(--bg-input);
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s;
    }
    .image-dropzone.dragover { border-color: var(--accent-gold); background-color: rgba(217, 119, 6, 0.05); }
    .image-dropzone img { max-width: 100%; max-height: 200px; border-radius: 4px; object-fit: cover; margin-top: 6px; }
    .image-dropzone .dropzone-text { font-size: 0.75rem; color: var(--text-muted); }

    /* CHARACTERS */
    .char-card {
      background-color: var(--bg-element);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .char-card-header { display: flex; justify-content: space-between; gap: 8px; }
    .char-title-input { font-weight: 700; color: var(--accent-gold); }
    .char-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box {
      background-color: var(--bg-input);
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
    }
    .stat-box input { width: 40px; padding: 2px; text-align: center; }

    /* ACTS & SCENES */
    .act-card {
      background-color: var(--bg-element);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .act-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .act-title-input {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-gold);
      background: transparent;
      border: 1px solid transparent;
    }

    .scenes-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 30px;
      padding: 4px;
      border: 1px dashed rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }

    .scene-card {
      background-color: #161920;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .scene-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent-gold);
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 6px;
    }

    .scene-blocks-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 20px;
    }

    /* SCENE SUB-BLOCKS */
    .scene-block {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scene-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    /* ENEMY ROW WITH ICONS */
    .enemy-row-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .enemy-row {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr 1.5fr auto;
      gap: 6px;
      align-items: center;
      background-color: var(--bg-element);
      padding: 6px;
      border-radius: 4px;
    }
    .enemy-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
    }
    .enemy-input-group input { padding: 4px; font-size: 0.75rem; }
    .enemy-special-input {
      font-size: 0.75rem;
      color: var(--accent-gold);
      background-color: var(--bg-input);
      border: 1px dashed var(--border-color);
    }

    /* ITEMS */
    .item-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .item-row-full {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 8px;
    }

    .inv-row-main {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .inv-row-main input[type="text"] {
      flex: 1;
    }

    .inv-qty-input {
      width: 55px;
      flex: none;
    }

    .inv-desc-input {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .add-block-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
    }

    .char-slot-empty { font-size: 0.85rem; color: var(--text-muted); }

    /* MODAL: ВИБІР ГРАВЦЯ / ПЕРСОНАЖА */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      padding: 12px 16px;
      background-color: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: var(--accent-gold);
    }
    .btn-modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }
    .btn-modal-close:hover { color: var(--text-main); }
    .modal-body {
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .modal-list-item {
      background-color: var(--bg-element);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .modal-list-item:hover { background-color: #2a303c; }
    .modal-item-meta { font-size: 0.75rem; color: var(--text-muted); }
    .modal-empty { font-size: 0.85rem; color: var(--text-muted); padding: 8px 0; }
    .modal-loading { font-size: 0.85rem; color: var(--text-muted); padding: 8px 0; text-align: center; }

    /* ПЕРЕГЛЯД ЗОБРАЖЕННЯ НА ВЕСЬ ЕКРАН (ЛАЙТБОКС) */
    .lightbox-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 5000;
      cursor: zoom-out;
      padding: 20px;
    }
    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title-container">
      <button onclick="window.location.href='/story_navigation'" class="btn btn-dark" title="До списку історій">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <i class="fa-solid fa-book-bookmark" style="color: var(--accent-gold); font-size: 1.2rem;"></i>
      <input type="text" id="adventureTitle" class="adventure-title-input" value="Прокляття Старого Лісу">
    </div>
    <button onclick="saveAdventure()" class="btn btn-gold">
      <i class="fa-solid fa-floppy-disk"></i> Зберегти пригоду
    </button>
  </header>

  <main>
    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title"><i class="fa-solid fa-users"></i> Персонажі Гравців</h2>
        <button onclick="addCharacter()" class="btn btn-outline" style="font-size: 0.75rem; padding: 2px 6px;">
          + Персонаж
        </button>
      </div>
      <div class="panel-body" id="charactersContainer"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title"><i class="fa-solid fa-scroll"></i> Сценарій Пригоди</h2>
        <button onclick="addAct()" class="btn btn-outline">
          <i class="fa-solid fa-plus"></i> Додати Акт
        </button>
      </div>
      <div class="panel-body" id="actsContainer"></div>
    </section>
  </main>

  <script>
    // СТАН ПРИГОДИ - завантажується з бекенду за story_id з URL.
    // Порожній шаблон використовується лише як fallback, якщо запит не вдався.
    let adventureData = {
      title: "Нова історія",
      characters: [],
      acts: []
    };

    function getStoryIdFromUrl() {
      return new URLSearchParams(window.location.search).get('story_id');
    }

    // ІНІЦІАЛІЗАЦІЯ
    document.addEventListener('DOMContentLoaded', async () => {
      const storyId = getStoryIdFromUrl();
      if (!storyId) {
        alert("Не вказано ID історії (відсутній story_id у посиланні).");
        window.location.href = '/story_navigation';
        return;
      }

      try {
        const response = await fetch(`/api/stories/${storyId}`);
        if (!response.ok) {
          alert("Історію не знайдено на сервері.");
          window.location.href = '/story_navigation';
          return;
        }
        const data = await response.json();
        adventureData = {
          title: data.title || "Нова історія",
          characters: data.characters || [],
          acts: data.acts || []
        };
      } catch (err) {
        console.error(err);
        alert("Помилка з'єднання з сервером під час завантаження історії.");
      }

      // Міграція старих Актів (description/imageUrl) у нову систему блоків,
      // якщо історія була створена/збережена до цього оновлення.
      (adventureData.acts || []).forEach(act => {
        if (!act.blocks) {
          act.blocks = [];
          if (act.description) {
            act.blocks.push({ id: 'b_' + Date.now() + Math.random().toString(36).slice(2, 6), type: 'description', content: act.description });
          }
          if (act.imageUrl) {
            act.blocks.push({ id: 'b_' + Date.now() + Math.random().toString(36).slice(2, 6), type: 'visual', imageUrl: act.imageUrl });
          }
          delete act.description;
          delete act.imageUrl;
        }
      });

      // Міграція старого формату предметів (рядок) у новий {name, qty, desc} -
      // такий самий формат, як у інвентарі персонажа, щоб передача предметів
      // із сценарію в інвентар не конфліктувала за типом даних.
      function migrateItemBlocks(blocks) {
        (blocks || []).forEach(block => {
          if (block.type === 'items' && Array.isArray(block.list)) {
            block.list = block.list.map(item =>
              typeof item === 'string' ? { name: item, qty: 1, desc: '' } : item
            );
          }
        });
      }
      (adventureData.acts || []).forEach(act => {
        migrateItemBlocks(act.blocks);
        (act.scenes || []).forEach(scene => migrateItemBlocks(scene.blocks));
      });

      document.getElementById('adventureTitle').value = adventureData.title;
      document.getElementById('adventureTitle').addEventListener('input', (e) => {
        adventureData.title = e.target.value;
      });
      renderCharacters();
      renderActs();
    });

    // =========================================================================
    // ПЕРСОНАЖІ ГРАВЦІВ - тепер обираються з реального списку гравців/персонажів
    // DM (а не вводяться вручну). "Ціль" зберігається окремо для кожного слота,
    // тобто прив'язана саме до цієї пари (character_id, story).
    // =========================================================================
    function renderCharacters() {
      const container = document.getElementById('charactersContainer');
      container.innerHTML = '';

      adventureData.characters.forEach((char, index) => {
        const card = document.createElement('div');
        card.className = 'char-card';

        if (!char.character_id) {
          card.innerHTML = `
            <div class="char-card-header">
              <span class="char-slot-empty">Слот персонажа не заповнено</span>
              <button onclick="removeCharacter(${index})" class="btn btn-danger" style="padding: 2px 6px;"><i class="fa-solid fa-trash"></i></button>
            </div>
            <button onclick="pickCharacterForSlot(${index})" class="btn btn-outline" style="align-self:flex-start;">
              <i class="fa-solid fa-link"></i> Обрати гравця та персонажа
            </button>
          `;
          container.appendChild(card);
          return;
        }

        card.innerHTML = `
          <div class="char-card-header">
            <div>
              <div style="font-weight:700; color: var(--accent-gold);">${char.name}</div>
              <div style="font-size:0.75rem; color: var(--text-muted);">${char.role || 'Без ролі'} · Гравець: ${char.player || '—'}</div>
            </div>
            <button onclick="removeCharacter(${index})" class="btn btn-danger" style="padding: 2px 6px;"><i class="fa-solid fa-trash"></i></button>
          </div>
          <button onclick="pickCharacterForSlot(${index})" class="btn btn-dark" style="font-size:0.75rem; align-self:flex-start;">
            <i class="fa-solid fa-rotate"></i> Змінити персонажа
          </button>
          <input type="text" class="char-title-input" value="${char.title || ''}" placeholder="Титул для цієї пригоди (необов'язково)" onchange="adventureData.characters[${index}].title = this.value">
          <div class="char-stats-grid">
            <div class="stat-box">
              <span>HP:</span>
              <div>
                <input type="number" value="${char.hp}" onchange="adventureData.characters[${index}].hp = +this.value"> /
                <input type="number" value="${char.maxHp}" onchange="adventureData.characters[${index}].maxHp = +this.value">
              </div>
            </div>
            <div class="stat-box">
              <span>AC:</span>
              <input type="number" value="${char.ac}" onchange="adventureData.characters[${index}].ac = +this.value">
            </div>
          </div>
          <textarea rows="2" placeholder="Особиста ціль у цій пригоді..." onchange="adventureData.characters[${index}].goal = this.value">${char.goal || ''}</textarea>
        `;
        container.appendChild(card);
      });
    }

    function addCharacter() {
      adventureData.characters.push({
        id: 'sc_' + Date.now(),
        character_id: null,
        player_id: null,
        title: '',
        name: '',
        role: '',
        hp: 10, maxHp: 10, ac: 10,
        player: '',
        goal: ''
      });
      renderCharacters();
    }

    function removeCharacter(index) {
      adventureData.characters.splice(index, 1);
      renderCharacters();
    }

    function pickCharacterForSlot(index) {
      openCharacterPickerModal(async (selection) => {
        let fullChar = null;
        try {
          const res = await fetch(`/api/characters/${selection.characterId}`);
          if (res.ok) fullChar = await res.json();
        } catch (e) {
          console.error(e);
        }

        adventureData.characters[index].character_id = selection.characterId;
        adventureData.characters[index].player_id = selection.playerId;
        adventureData.characters[index].player = selection.playerName;
        adventureData.characters[index].name = selection.characterName;
        adventureData.characters[index].role = selection.characterRole || '';
        if (fullChar) {
          adventureData.characters[index].hp = fullChar.current_hp;
          adventureData.characters[index].maxHp = fullChar.max_hp;
          adventureData.characters[index].ac = fullChar.ac;
        }
        renderCharacters();
      });
    }

    // --- МОДАЛЬНЕ ВІКНО: ГРАВЕЦЬ -> ПЕРСОНАЖ ---
    async function fetchDmPlayers() {
      const dmId = localStorage.getItem('dm_id');
      if (!dmId) return [];
      try {
        const res = await fetch(`/api/dm/${dmId}/players`);
        if (!res.ok) return [];
        return await res.json();
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    function openCharacterPickerModal(onSelect) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-header">
            <span id="modalTitle">Оберіть гравця</span>
            <button class="btn-modal-close" id="modalCloseBtn">&times;</button>
          </div>
          <div class="modal-body" id="modalBody">
            <div class="modal-loading">Завантаження...</div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      overlay.querySelector('#modalCloseBtn').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      fetchDmPlayers().then(players => renderPlayerStep(overlay, players, onSelect));
    }

    function renderPlayerStep(overlay, players, onSelect) {
      overlay.querySelector('#modalTitle').textContent = 'Оберіть гравця';
      const body = overlay.querySelector('#modalBody');

      if (players.length === 0) {
        body.innerHTML = `<p class="modal-empty">У вас ще немає доданих гравців. Додайте гравця у розділі "Гравці".</p>`;
        return;
      }

      body.innerHTML = players.map(p => `
        <div class="modal-list-item" data-player-id="${p.id}">
          <span>${p.name}</span>
          <span class="modal-item-meta">${p.characters.length} персонаж(ів)</span>
        </div>
      `).join('');

      body.querySelectorAll('.modal-list-item').forEach(item => {
        item.addEventListener('click', () => {
          const playerId = parseInt(item.dataset.playerId);
          const player = players.find(p => p.id === playerId);
          renderCharacterStep(overlay, player, players, onSelect);
        });
      });
    }

    function renderCharacterStep(overlay, player, allPlayers, onSelect) {
      overlay.querySelector('#modalTitle').textContent = `Персонажі: ${player.name}`;
      const body = overlay.querySelector('#modalBody');

      const backBtnHtml = `<button class="btn btn-dark" id="backToPlayersBtn" style="margin-bottom:6px; align-self:flex-start;">← Назад до гравців</button>`;

      if (player.characters.length === 0) {
        body.innerHTML = backBtnHtml + `<p class="modal-empty">У гравця "${player.name}" ще немає персонажів.</p>`;
      } else {
        body.innerHTML = backBtnHtml + player.characters.map(c => `
          <div class="modal-list-item" data-char-id="${c.id}">
            <span>${c.name}</span>
            <span class="modal-item-meta">${c.role || ''}</span>
          </div>
        `).join('');
      }

      body.querySelector('#backToPlayersBtn').addEventListener('click', () => {
        renderPlayerStep(overlay, allPlayers, onSelect);
      });

      body.querySelectorAll('.modal-list-item[data-char-id]').forEach(item => {
        item.addEventListener('click', () => {
          const charId = parseInt(item.dataset.charId);
          const char = player.characters.find(c => c.id === charId);
          overlay.remove();
          onSelect({
            playerId: player.id,
            playerName: player.name,
            characterId: char.id,
            characterName: char.name,
            characterRole: char.role
          });
        });
      });
    }

    // =========================================================================
    // АКТИ ТА СЦЕНИ
    // Акти тепер мають ту саму динамічну систему блоків, що й Сцени
    // (замість фіксованих полів опис+обкладинка).
    // =========================================================================
    function renderActs() {
      const container = document.getElementById('actsContainer');
      container.innerHTML = '';

      adventureData.acts.forEach((act, actIdx) => {
        const actCard = document.createElement('div');
        actCard.className = 'act-card';

        actCard.innerHTML = `
          <div class="act-header">
            <input type="text" class="act-title-input" value="${act.title}" onchange="adventureData.acts[${actIdx}].title = this.value">
            <button onclick="removeAct(${actIdx})" class="btn btn-danger" style="font-size: 0.75rem;"><i class="fa-solid fa-trash"></i> Видалити Акт</button>
          </div>

          <div class="scene-blocks-container act-blocks-container" data-act-idx="${actIdx}" data-scene-idx=""></div>

          <div class="add-block-actions">
            <button onclick="addBlock(${actIdx}, null, 'description')" class="btn btn-dark" style="font-size: 0.75rem;">+ Опис</button>
            <button onclick="addBlock(${actIdx}, null, 'visual')" class="btn btn-dark" style="font-size: 0.75rem;">+ Візуальний Опис</button>
            <button onclick="addBlock(${actIdx}, null, 'enemies')" class="btn btn-dark" style="font-size: 0.75rem;">+ Вороги</button>
            <button onclick="addBlock(${actIdx}, null, 'items')" class="btn btn-dark" style="font-size: 0.75rem;">+ Предмети</button>
          </div>

          <div class="scenes-container" data-act-index="${actIdx}"></div>

          <button onclick="addScene(${actIdx})" class="btn btn-dark" style="margin-top: 6px;">
            <i class="fa-solid fa-plus"></i> Додати Сцену
          </button>
        `;

        container.appendChild(actCard);

        const actBlocksContainer = actCard.querySelector('.act-blocks-container');
        renderBlocks(actIdx, null, actBlocksContainer);

        const scenesContainer = actCard.querySelector('.scenes-container');
        renderScenes(actIdx, scenesContainer);
      });
    }

    function addAct() {
      adventureData.acts.push({
        id: 'act_' + Date.now(),
        title: `Акт ${adventureData.acts.length + 1}`,
        blocks: [
          { id: 'b_' + Date.now(), type: 'description', content: '' }
        ],
        scenes: []
      });
      renderActs();
    }

    function removeAct(actIdx) {
      if (confirm('Видалити цей Акт разом зі всіма сценами?')) {
        adventureData.acts.splice(actIdx, 1);
        renderActs();
      }
    }

    // --- РЕНДЕР СЦЕН І DRAG & DROP СЦЕН ---
    function renderScenes(actIdx, container) {
      container.innerHTML = '';

      adventureData.acts[actIdx].scenes.forEach((scene, sceneIdx) => {
        const sceneCard = document.createElement('div');
        sceneCard.className = 'scene-card';
        sceneCard.draggable = true;
        sceneCard.dataset.actIdx = actIdx;
        sceneCard.dataset.sceneIdx = sceneIdx;

        sceneCard.innerHTML = `
          <div class="scene-header">
            <span><i class="fa-solid fa-grip-vertical drag-handle"></i> ${scene.title}</span>
            <button onclick="removeScene(${actIdx}, ${sceneIdx})" class="btn btn-danger" style="padding: 2px 6px; font-size: 0.7rem;"><i class="fa-solid fa-trash"></i></button>
          </div>
          <input type="text" value="${scene.title}" placeholder="Назва Сцени" onchange="adventureData.acts[${actIdx}].scenes[${sceneIdx}].title = this.value">

          <div class="scene-blocks-container" data-act-idx="${actIdx}" data-scene-idx="${sceneIdx}"></div>

          <div class="add-block-actions">
            <button onclick="addBlock(${actIdx}, ${sceneIdx}, 'description')" class="btn btn-dark" style="font-size: 0.75rem;">+ Опис</button>
            <button onclick="addBlock(${actIdx}, ${sceneIdx}, 'visual')" class="btn btn-dark" style="font-size: 0.75rem;">+ Візуальний Опис</button>
            <button onclick="addBlock(${actIdx}, ${sceneIdx}, 'enemies')" class="btn btn-dark" style="font-size: 0.75rem;">+ Вороги</button>
            <button onclick="addBlock(${actIdx}, ${sceneIdx}, 'items')" class="btn btn-dark" style="font-size: 0.75rem;">+ Предмети</button>
          </div>
        `;

        container.appendChild(sceneCard);

        setupSceneDragging(sceneCard);

        const blocksContainer = sceneCard.querySelector('.scene-blocks-container');
        renderBlocks(actIdx, sceneIdx, blocksContainer);
      });

      setupSceneContainerDrop(container);
    }

    function addScene(actIdx) {
      const newSceneNum = adventureData.acts[actIdx].scenes.length + 1;
      adventureData.acts[actIdx].scenes.push({
        id: 'sc_' + Date.now(),
        title: `Сцена ${newSceneNum}`,
        blocks: [
          { id: 'b_' + Date.now(), type: 'description', content: '' }
        ]
      });
      renderActs();
    }

    function removeScene(actIdx, sceneIdx) {
      adventureData.acts[actIdx].scenes.splice(sceneIdx, 1);
      renderActs();
    }

    // =========================================================================
    // УНІФІКОВАНА СИСТЕМА БЛОКІВ
    // Працює як для блоків Акту (sceneIdx === null), так і для блоків Сцени
    // (sceneIdx - число). Зображення (visual/enemies) та підпис (visual) -
    // опціональні: додаються/видаляються окремими кнопками, а не завжди
    // присутні за замовчуванням.
    // =========================================================================
    function getBlocksArray(actIdx, sceneIdx) {
      return (sceneIdx === null || sceneIdx === undefined)
        ? adventureData.acts[actIdx].blocks
        : adventureData.acts[actIdx].scenes[sceneIdx].blocks;
    }

    function blockRefExpr(actIdx, sceneIdx, blockIdx) {
      return (sceneIdx === null || sceneIdx === undefined)
        ? `adventureData.acts[${actIdx}].blocks[${blockIdx}]`
        : `adventureData.acts[${actIdx}].scenes[${sceneIdx}].blocks[${blockIdx}]`;
    }

    function renderBlocks(actIdx, sceneIdx, container) {
      const blocks = getBlocksArray(actIdx, sceneIdx);
      const sceneIdxAttr = (sceneIdx === null || sceneIdx === undefined) ? '' : sceneIdx;
      const sceneIdxArg = (sceneIdx === null || sceneIdx === undefined) ? 'null' : sceneIdx;
      const idScope = (sceneIdx === null || sceneIdx === undefined) ? 'act' : sceneIdx;

      container.innerHTML = '';

      blocks.forEach((block, blockIdx) => {
        const blockEl = document.createElement('div');
        blockEl.className = 'scene-block';
        blockEl.draggable = true;
        blockEl.dataset.actIdx = actIdx;
        blockEl.dataset.sceneIdx = sceneIdxAttr;
        blockEl.dataset.blockIdx = blockIdx;

        const ref = blockRefExpr(actIdx, sceneIdx, blockIdx);
        let contentHtml = '';
        let hasImage = false;

        if (block.type === 'description') {
          contentHtml = `
            <div class="scene-block-header">
              <span><i class="fa-solid fa-grip-vertical drag-handle"></i> 📝 Текстовий Опис</span>
              <button onclick="removeBlock(${actIdx}, ${sceneIdxArg}, ${blockIdx})" class="btn btn-danger" style="padding: 1px 5px; font-size: 0.7rem;"><i class="fa-solid fa-trash"></i></button>
            </div>
            <textarea rows="2" placeholder="Введіть текстовий опис..." onchange="${ref}.content = this.value">${block.content || ''}</textarea>
          `;
        } else if (block.type === 'visual') {
          hasImage = block.imageUrl !== undefined && block.imageUrl !== null;
          const hasCaption = block.caption !== undefined && block.caption !== null;
          const zoneId = `vis-img-zone-${actIdx}-${idScope}-${blockIdx}`;
          const fileId = `vis-file-${actIdx}-${idScope}-${blockIdx}`;

          contentHtml = `
            <div class="scene-block-header">
              <span><i class="fa-solid fa-grip-vertical drag-handle"></i> 🖼️ Візуальний Опис</span>
              <button onclick="removeBlock(${actIdx}, ${sceneIdxArg}, ${blockIdx})" class="btn btn-danger" style="padding: 1px 5px; font-size: 0.7rem;"><i class="fa-solid fa-trash"></i></button>
            </div>
            ${hasImage ? `
              <div class="image-dropzone" id="${zoneId}" tabindex="0" onclick="triggerFileInput('${fileId}')" onpaste="handleImagePaste(event, (url) => { ${ref}.imageUrl = url; renderActs(); })">
                <span class="dropzone-text"><i class="fa-solid fa-image"></i> Натисніть, вставте (Ctrl+V) або перетягніть файл зображення</span>
                <input type="file" id="${fileId}" style="display:none" accept="image/*" onchange="handleFileSelect(event, (url) => { ${ref}.imageUrl = url; renderActs(); })">
                <input type="text" placeholder="URL зображення..." value="${block.imageUrl || ''}" style="margin-top: 4px;" onclick="event.stopPropagation()" onchange="${ref}.imageUrl = this.value; renderActs();">
                ${block.imageUrl ? `<img src="${block.imageUrl}" alt="Visual Description Image" onclick="event.stopPropagation(); openImageLightbox(this.src);" style="cursor: zoom-in;">` : ''}
              </div>
              <button onclick="delete ${ref}.imageUrl; renderActs();" class="btn btn-danger" style="font-size:0.7rem; align-self:flex-start;"><i class="fa-solid fa-trash"></i> Видалити зображення</button>
            ` : `
              <button onclick="${ref}.imageUrl=''; renderActs();" class="btn btn-outline" style="font-size:0.75rem; align-self:flex-start;">+ Додати зображення</button>
            `}
            ${hasCaption ? `
              <div class="item-row">
                <input type="text" placeholder="Підпис / Коментар до артів..." value="${block.caption || ''}" onchange="${ref}.caption = this.value">
                <button onclick="delete ${ref}.caption; renderActs();" class="btn btn-danger" style="padding: 2px 6px;"><i class="fa-solid fa-trash"></i></button>
              </div>
            ` : `
              <button onclick="${ref}.caption=''; renderActs();" class="btn btn-outline" style="font-size:0.75rem; align-self:flex-start;">+ Додати підпис</button>
            `}
          `;
        } else if (block.type === 'enemies') {
          hasImage = block.imageUrl !== undefined && block.imageUrl !== null;
          const zoneId = `enemy-img-zone-${actIdx}-${idScope}-${blockIdx}`;
          const fileId = `enemy-file-${actIdx}-${idScope}-${blockIdx}`;

          let enemiesRows = (block.list || []).map((e, enemyIdx) => `
            <div class="enemy-row-wrapper">
              <div class="enemy-row">
                <input type="text" value="${e.name}" placeholder="Ім'я ворога" onchange="${ref}.list[${enemyIdx}].name = this.value">
                <div class="enemy-input-group">
                  <span>❤️</span>
                  <input type="number" value="${e.hp}" placeholder="HP" onchange="${ref}.list[${enemyIdx}].hp = +this.value">
                </div>
                <div class="enemy-input-group">
                  <span>🛡️</span>
                  <input type="number" value="${e.ac}" placeholder="AC" onchange="${ref}.list[${enemyIdx}].ac = +this.value">
                </div>
                <div class="enemy-input-group">
                  <span>⚔️</span>
                  <input type="text" value="${e.attack}" placeholder="Атака" onchange="${ref}.list[${enemyIdx}].attack = this.value">
                </div>
                <button onclick="removeEnemy(${actIdx}, ${sceneIdxArg}, ${blockIdx}, ${enemyIdx})" class="btn btn-danger" style="padding: 2px 4px;"><i class="fa-solid fa-trash"></i></button>
              </div>
              <input type="text" value="${e.special || ''}" placeholder="🌟 Спецатака (необов'язково) - напр. 'Атакує двічі підряд' або 'Отруйна атака - 3 шкоди щохід'" class="enemy-special-input" onchange="${ref}.list[${enemyIdx}].special = this.value">
            </div>
          `).join('');

          contentHtml = `
            <div class="scene-block-header">
              <span><i class="fa-solid fa-grip-vertical drag-handle"></i> ⚔️ Група Ворогів</span>
              <button onclick="removeBlock(${actIdx}, ${sceneIdxArg}, ${blockIdx})" class="btn btn-danger" style="padding: 1px 5px; font-size: 0.7rem;"><i class="fa-solid fa-trash"></i></button>
            </div>

            ${hasImage ? `
              <div class="image-dropzone" id="${zoneId}" tabindex="0" onclick="triggerFileInput('${fileId}')" onpaste="handleImagePaste(event, (url) => { ${ref}.imageUrl = url; renderActs(); })">
                <span class="dropzone-text"><i class="fa-solid fa-image"></i> Фото/аватар для цієї групи ворогів (можна вставити Ctrl+V)</span>
                <input type="file" id="${fileId}" style="display:none" accept="image/*" onchange="handleFileSelect(event, (url) => { ${ref}.imageUrl = url; renderActs(); })">
                <input type="text" placeholder="URL зображення ворогів..." value="${block.imageUrl || ''}" style="margin-top: 4px;" onclick="event.stopPropagation()" onchange="${ref}.imageUrl = this.value; renderActs();">
                ${block.imageUrl ? `<img src="${block.imageUrl}" alt="Enemy Group Image" onclick="event.stopPropagation(); openImageLightbox(this.src);" style="cursor: zoom-in;">` : ''}
              </div>
              <button onclick="delete ${ref}.imageUrl; renderActs();" class="btn btn-danger" style="font-size:0.7rem; align-self:flex-start;"><i class="fa-solid fa-trash"></i> Видалити зображення</button>
            ` : `
              <button onclick="${ref}.imageUrl=''; renderActs();" class="btn btn-outline" style="font-size:0.75rem; align-self:flex-start;">+ Додати зображення</button>
            `}

            <div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">
              ${enemiesRows}
            </div>
            <button onclick="addEnemyRow(${actIdx}, ${sceneIdxArg}, ${blockIdx})" class="btn btn-outline" style="font-size:0.75rem; padding: 2px 6px; align-self: flex-start; margin-top:4px;">+ Додати ворога у групу</button>
          `;
        } else if (block.type === 'items') {
          let itemsRows = (block.list || []).map((item, itemIdx) => `
            <div class="item-row-full">
              <div class="inv-row-main">
                <input type="text" value="${item.name}" placeholder="Назва предмета" onchange="${ref}.list[${itemIdx}].name = this.value">
                <input type="number" value="${item.qty || 1}" min="1" class="inv-qty-input" onchange="${ref}.list[${itemIdx}].qty = parseInt(this.value) || 1">
                <button onclick="removeItemRow(${actIdx}, ${sceneIdxArg}, ${blockIdx}, ${itemIdx})" class="btn btn-danger" style="padding: 2px 6px;"><i class="fa-solid fa-trash"></i></button>
              </div>
              <input type="text" value="${item.desc || ''}" placeholder="Опис предмета (необов'язково)" class="inv-desc-input" onchange="${ref}.list[${itemIdx}].desc = this.value">
            </div>
          `).join('');

          contentHtml = `
            <div class="scene-block-header">
              <span><i class="fa-solid fa-grip-vertical drag-handle"></i> 🎁 Предмети / Лут</span>
              <button onclick="removeBlock(${actIdx}, ${sceneIdxArg}, ${blockIdx})" class="btn btn-danger" style="padding: 1px 5px; font-size: 0.7rem;"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              ${itemsRows}
            </div>
            <button onclick="addItemRow(${actIdx}, ${sceneIdxArg}, ${blockIdx})" class="btn btn-outline" style="font-size:0.75rem; padding: 2px 6px; align-self: flex-start; margin-top:4px;">+ Додати предмет</button>
          `;
        }

        blockEl.innerHTML = contentHtml;
        container.appendChild(blockEl);

        if ((block.type === 'visual' || block.type === 'enemies') && hasImage) {
          const zoneId = `${block.type === 'visual' ? 'vis' : 'enemy'}-img-zone-${actIdx}-${idScope}-${blockIdx}`;
          setupDropzone(zoneId, (url) => {
            getBlocksArray(actIdx, sceneIdx)[blockIdx].imageUrl = url;
            renderActs();
          });
        }

        setupBlockDragging(blockEl);
      });

      setupBlockContainerDrop(container);
    }

    // УПРАВЛІННЯ БЛОКАМИ (спільне для Актів і Сцен)
    function addBlock(actIdx, sceneIdx, type) {
      let newBlock = { id: 'b_' + Date.now() + Math.random().toString(36).slice(2, 6), type: type };
      if (type === 'description') newBlock.content = '';
      if (type === 'enemies') newBlock.list = [{ name: 'Монстр', hp: 10, ac: 10, attack: '+2 (1d6)' }];
      if (type === 'items') newBlock.list = [{ name: 'Новий предмет', qty: 1, desc: '' }];
      // Для 'visual' свідомо НЕ додаємо imageUrl/caption одразу -
      // вони опціональні і додаються окремими кнопками "+ Додати..."

      getBlocksArray(actIdx, sceneIdx).push(newBlock);
      renderActs();
    }

    function removeBlock(actIdx, sceneIdx, blockIdx) {
      getBlocksArray(actIdx, sceneIdx).splice(blockIdx, 1);
      renderActs();
    }

    function addEnemyRow(actIdx, sceneIdx, blockIdx) {
      getBlocksArray(actIdx, sceneIdx)[blockIdx].list.push({ name: 'Монстр', hp: 10, ac: 10, attack: '+2 (1d6)' });
      renderActs();
    }

    function removeEnemy(actIdx, sceneIdx, blockIdx, enemyIdx) {
      getBlocksArray(actIdx, sceneIdx)[blockIdx].list.splice(enemyIdx, 1);
      renderActs();
    }

    function addItemRow(actIdx, sceneIdx, blockIdx) {
      getBlocksArray(actIdx, sceneIdx)[blockIdx].list.push({ name: 'Новий предмет', qty: 1, desc: '' });
      renderActs();
    }

    function removeItemRow(actIdx, sceneIdx, blockIdx, itemIdx) {
      getBlocksArray(actIdx, sceneIdx)[blockIdx].list.splice(itemIdx, 1);
      renderActs();
    }

    // --- ОБРОБКА ЗОБРАЖЕНЬ ---
    // callback(url) викликається з реальним посиланням на файл у сховищі
    // (не з base64) - решта коду блоків цього не бачить, інтерфейс той самий.
    function triggerFileInput(id) {
      document.getElementById(id).click();
    }

    function handleImagePaste(event, callback) {
      const items = event.clipboardData && event.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          event.preventDefault();
          const file = item.getAsFile();
          if (file) uploadImageFile(file, callback);
          return;
        }
      }
    }

    function openImageLightbox(url) {
      if (!url) return;
      const overlay = document.createElement('div');
      overlay.className = 'lightbox-overlay';
      overlay.innerHTML = `<img src="${url}" class="lightbox-img" alt="Перегляд зображення">`;
      overlay.addEventListener('click', () => overlay.remove());
      document.body.appendChild(overlay);
    }

    async function uploadImageFile(file, callback) {
      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/upload-image', { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert(err.detail || 'Не вдалося завантажити зображення на сервер.');
          return;
        }
        const result = await res.json();
        callback(result.url);
      } catch (err) {
        console.error(err);
        alert("Помилка з'єднання при завантаженні зображення.");
      }
    }

    function handleFileSelect(event, callback) {
      const file = event.target.files[0];
      if (file) uploadImageFile(file, callback);
    }

    function setupDropzone(elementId, callback) {
      setTimeout(() => {
        const zone = document.getElementById(elementId);
        if (!zone) return;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
          zone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
          }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
          zone.addEventListener(eventName, () => zone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
          zone.addEventListener(eventName, () => zone.classList.remove('dragover'), false);
        });

        zone.addEventListener('drop', (e) => {
          const dt = e.dataTransfer;
          const files = dt.files;
          if (files.length > 0) uploadImageFile(files[0], callback);
        }, false);
      }, 50);
    }

    // --- DRAG AND DROP ДЛЯ СЦЕН ТА БЛОКІВ ---
    let draggedItem = null;
    let dragType = null;

    function setupSceneDragging(el) {
      el.addEventListener('dragstart', (e) => {
        draggedItem = { actIdx: +el.dataset.actIdx, sceneIdx: +el.dataset.sceneIdx };
        dragType = 'scene';
        el.classList.add('dragging');
        e.stopPropagation();
      });

      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
        draggedItem = null;
        dragType = null;
      });
    }

    function setupSceneContainerDrop(container) {
      container.addEventListener('dragover', (e) => {
        if (dragType !== 'scene') return;
        e.preventDefault();
      });

      container.addEventListener('drop', (e) => {
        if (dragType !== 'scene') return;
        e.preventDefault();
        const targetActIdx = +container.dataset.actIndex;

        const sceneCard = adventureData.acts[draggedItem.actIdx].scenes.splice(draggedItem.sceneIdx, 1)[0];
        adventureData.acts[targetActIdx].scenes.push(sceneCard);
        renderActs();
      });
    }

    function setupBlockDragging(el) {
      el.addEventListener('dragstart', (e) => {
        draggedItem = {
          actIdx: +el.dataset.actIdx,
          sceneIdx: el.dataset.sceneIdx === '' ? null : +el.dataset.sceneIdx,
          blockIdx: +el.dataset.blockIdx
        };
        dragType = 'block';
        el.classList.add('dragging');
        e.stopPropagation();
      });

      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
        draggedItem = null;
        dragType = null;
      });
    }

    function setupBlockContainerDrop(container) {
      container.addEventListener('dragover', (e) => {
        if (dragType !== 'block') return;
        e.preventDefault();
      });

      container.addEventListener('drop', (e) => {
        if (dragType !== 'block') return;
        e.preventDefault();
        const targetActIdx = +container.dataset.actIdx;
        const targetSceneIdx = container.dataset.sceneIdx === '' ? null : +container.dataset.sceneIdx;

        const sourceBlocks = getBlocksArray(draggedItem.actIdx, draggedItem.sceneIdx);
        const block = sourceBlocks.splice(draggedItem.blockIdx, 1)[0];
        getBlocksArray(targetActIdx, targetSceneIdx).push(block);
        renderActs();
      });
    }

    async function saveAdventure() {
      const storyId = getStoryIdFromUrl();
      if (!storyId) {
        alert("Не вказано ID історії - неможливо зберегти.");
        return;
      }

      try {
        const response = await fetch(`/api/stories/${storyId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: adventureData.title,
            characters: adventureData.characters,
            acts: adventureData.acts
          })
        });

        if (response.ok) {
          alert("Пригоду успішно збережено!");
        } else {
          const result = await response.json().catch(() => ({}));
          alert("Помилка збереження: " + (result.detail || `HTTP ${response.status}`));
        }
      } catch (err) {
        console.error("Помилка під час збереження історії:", err);
        alert("Критична помилка при збереженні!");
      }
    }
</script>
