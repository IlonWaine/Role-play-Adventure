<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D DM Dashboard — Панель Майстра</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f1115;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1a1d24;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #d97706;
    }
    .border-gold {
      border-color: #d97706;
    }
    .text-gold {
      color: #fbbf24;
    }
    .bg-card {
      background-color: #1a1d24;
    }
    .bg-card-hover:hover {
      background-color: #242832;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <header class="bg-card border-b border-gray-800 px-6 py-3 flex items-center justify-between shadow-lg z-10">
    <div class="flex items-center space-x-4">
      <div class="text-gold font-bold text-xl flex items-center gap-2">
        <i class="fa-solid font-sharp fa-d-and-d text-2xl text-amber-500"></i>
        <span>DM Control Center</span>
      </div>
      <span class="bg-gray-800 text-xs px-2.5 py-1 rounded-full text-gray-400 border border-gray-700">
        Сесія: <strong class="text-amber-400" id="sessionCode">#X89A12</strong>
      </span>
    </div>

    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2 text-xs text-gray-400 bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-800">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>WS Status: <strong class="text-emerald-400">Online</strong></span>
      </div>
      <button onclick="copySessionLink()" class="bg-amber-600 hover:bg-amber-500 text-gray-950 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-md">
        <i class="fa-solid fa-link"></i> Запросити гравців
      </button>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-12 gap-4 p-4 overflow-hidden">

    <section class="col-span-12 lg:col-span-4 bg-card rounded-xl border border-gray-800 flex flex-col overflow-hidden shadow-xl">
      <div class="p-3 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
        <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-users"></i> Гравці партії (<span id="playerCount">4</span>)
        </h2>
        <button onclick="openAddCharacterModal()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded border border-gray-700 transition">
          + Створити
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar" id="partyList">
        </div>
    </section>


    <section class="col-span-12 lg:col-span-5 flex flex-col gap-4 overflow-hidden">
      
      <div class="bg-card rounded-xl border border-gray-800 p-4 shadow-xl">
        <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center gap-2">
          <i class="fa-solid fa-gift"></i> Швидка видача луту (Quick Loot)
        </h2>
        
        <form id="lootForm" onsubmit="handleSendLoot(event)" class="space-y-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Назва предмета / Нагороди</label>
            <input type="text" id="lootName" placeholder="напр., Зілля вищого лікування" required
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Категорія</label>
              <select id="lootCategory" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500">
                <option value="potion">🧪 Зілля / Пляшечки</option>
                <option value="equipment">⚔️ Спорядження / Зброя</option>
                <option value="quest">📜 Квестовий предмет</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Отримувач</label>
              <select id="lootTarget" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500">
                <option value="all">🌐 Усе паті (Всі гравці)</option>
                </select>
            </div>
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Опис або ефект</label>
            <textarea id="lootDesc" rows="2" placeholder="Відновлює 4d4 + 4 ХП..."
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-amber-500 resize-none"></textarea>
          </div>

          <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-gray-950 font-bold py-2 rounded-lg text-sm transition shadow-lg flex justify-center items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> Видати предмет у реальному часі
          </button>
        </form>
      </div>

      <div class="bg-card rounded-xl border border-gray-800 p-4 shadow-xl">
        <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center gap-2">
          <i class="fa-solid fa-coins"></i> Масова видача монет (Gold Grant)
        </h2>
        <div class="grid grid-cols-3 gap-2 mb-3">
          <div class="bg-gray-900 border border-amber-500/30 p-2 rounded-lg text-center">
            <span class="text-xs text-amber-400 font-semibold block">🟡 Золото (GP)</span>
            <input type="number" id="grantGP" value="0" min="0" class="w-full bg-transparent text-center font-bold text-amber-300 text-lg focus:outline-none">
          </div>
          <div class="bg-gray-900 border border-gray-500/30 p-2 rounded-lg text-center">
            <span class="text-xs text-gray-300 font-semibold block">⚪ Срібло (SP)</span>
            <input type="number" id="grantSP" value="0" min="0" class="w-full bg-transparent text-center font-bold text-gray-200 text-lg focus:outline-none">
          </div>
          <div class="bg-gray-900 border border-amber-800/30 p-2 rounded-lg text-center">
            <span class="text-xs text-amber-700 font-semibold block">🟤 Мідь (CP)</span>
            <input type="number" id="grantCP" value="0" min="0" class="w-full bg-transparent text-center font-bold text-amber-600 text-lg focus:outline-none">
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="distributeCoins('divided')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs py-2 rounded-lg border border-gray-700 transition">
            ⚖️ Поділити порівну між усіма
          </button>
          <button onclick="distributeCoins('each')" class="flex-1 bg-amber-600/20 border border-amber-500/40 hover:bg-amber-600/30 text-amber-300 text-xs py-2 rounded-lg transition font-medium">
            🎁 Видати кожному цю суму
          </button>
        </div>
      </div>

    </section>


    <section class="col-span-12 lg:col-span-3 flex flex-col gap-4 overflow-hidden">
      
      <div class="bg-card rounded-xl border border-gray-800 p-3 shadow-xl">
        <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-2">
          <i class="fa-solid fa-user-ninja"></i> Секретне повідомлення (Whisper)
        </h2>
        <div class="space-y-2">
          <select id="whisperTarget" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs text-gray-100 focus:outline-none">
            </select>
          <textarea id="whisperText" rows="2" placeholder="Бачиш тільки ти: Попереду пастка..." 
            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-100 focus:outline-none resize-none"></textarea>
          <button onclick="sendWhisper()" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-amber-400 font-bold py-1.5 rounded-lg text-xs transition">
            📩 Надіслати секрет
          </button>
        </div>
      </div>

      <div class="bg-card rounded-xl border border-gray-800 flex-1 flex flex-col overflow-hidden shadow-xl">
        <div class="p-3 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
          <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-scroll"></i> Ігровий лог
          </h2>
          <button onclick="clearLog()" class="text-[10px] text-gray-500 hover:text-gray-300">Очистити</button>
        </div>
        <div class="flex-1 p-3 overflow-y-auto space-y-2 text-xs font-mono custom-scrollbar" id="activityLog">
          </div>
      </div>

    </section>

  </main>

  <script>
    // State management
    let players = [
      { id: '1', name: 'Арагорн', title: 'Воїн, 5 рівень', hp: 24, maxHp: 30, ac: 16, passivePerception: 13, online: true },
      { id: '2', name: 'Леголас', title: 'Слідопит, 5 рівень', hp: 18, maxHp: 18, ac: 15, passivePerception: 16, online: true },
      { id: '3', name: 'Ґімлі', title: 'Варвар, 5 рівень', hp: 35, maxHp: 40, ac: 18, passivePerception: 11, online: true },
      { id: '4', name: 'Ґендальф', title: 'Маг, 5 рівень', hp: 12, maxHp: 20, ac: 12, passivePerception: 14, online: false }
    ];

    // Initialize UI
    document.addEventListener('DOMContentLoaded', () => {
      renderParty();
      updateTargetDropdowns();
      addLogMessage('Сесія підключена. Очікування дій гравців...', 'system');
    });

    // Render Players
    function renderParty() {
      const container = document.getElementById('partyList');
      container.innerHTML = '';

      players.forEach(p => {
        const hpPercent = Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100));
        const hpBarColor = hpPercent < 25 ? 'bg-red-600' : hpPercent < 50 ? 'bg-amber-500' : 'bg-emerald-500';

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl bg-gray-900 border ${p.online ? 'border-gray-800' : 'border-gray-800/40 opacity-60'} shadow transition`;
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full ${p.online ? 'bg-emerald-500' : 'bg-gray-600'}"></span>
                <h3 class="font-bold text-gray-100 text-sm">${p.name}</h3>
              </div>
              <p class="text-[11px] text-gray-400 pl-4">${p.title}</p>
            </div>
            
            <div class="flex gap-2 text-xs">
              <div class="bg-gray-800 px-2 py-0.5 rounded border border-gray-700 text-center" title="Armor Class">
                <span class="text-gray-400 text-[9px] block">КД</span>
                <strong class="text-amber-300">${p.ac}</strong>
              </div>
              <div class="bg-gray-800 px-2 py-0.5 rounded border border-gray-700 text-center" title="Passive Perception">
                <span class="text-gray-400 text-[9px] block">Увага</span>
                <strong class="text-gray-200">${p.passivePerception}</strong>
              </div>
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-xs font-semibold">
              <span class="text-gray-400">Здоров'я (HP)</span>
              <span class="${hpPercent < 25 ? 'text-red-400 animate-pulse' : 'text-gray-200'}">${p.hp} / ${p.maxHp}</span>
            </div>
            
            <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
              <div class="h-full ${hpBarColor} transition-all duration-300" style="width: ${hpPercent}%"></div>
            </div>

            <div class="flex justify-end gap-1 pt-1">
              <button onclick="modifyHP('${p.id}', -5)" class="px-2 py-0.5 bg-red-950 hover:bg-red-900 text-red-300 border border-red-800/50 rounded text-[10px] font-bold">-5</button>
              <button onclick="modifyHP('${p.id}', -1)" class="px-2 py-0.5 bg-red-950 hover:bg-red-900 text-red-300 border border-red-800/50 rounded text-[10px] font-bold">-1</button>
              <button onclick="modifyHP('${p.id}', 1)" class="px-2 py-0.5 bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-800/50 rounded text-[10px] font-bold">+1</button>
              <button onclick="modifyHP('${p.id}', 5)" class="px-2 py-0.5 bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-800/50 rounded text-[10px] font-bold">+5</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('playerCount').innerText = players.length;
    }

    // Modify HP
    function modifyHP(playerId, amount) {
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      const oldHp = player.hp;
      player.hp = Math.max(0, Math.min(player.maxHp, player.hp + amount));
      renderParty();

      const diff = player.hp - oldHp;
      const sign = diff > 0 ? '+' : '';
      addLogMessage(`DM змінив ХП [${player.name}]: ${sign}${diff} (Тепер: ${player.hp}/${player.maxHp})`, 'action');
    }

    // Dynamic Dropdowns
    function updateTargetDropdowns() {
      const lootTarget = document.getElementById('lootTarget');
      const whisperTarget = document.getElementById('whisperTarget');

      // Preserve default 'all'
      lootTarget.innerHTML = '<option value="all">🌐 Усе паті (Всі гравці)</option>';
      whisperTarget.innerHTML = '';

      players.forEach(p => {
        lootTarget.innerHTML += `<option value="${p.id}">${p.name}</option>`;
        whisperTarget.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      });
    }

    // Send Loot
    function handleSendLoot(e) {
      e.preventDefault();
      const name = document.getElementById('lootName').value;
      const category = document.getElementById('lootCategory').value;
      const targetId = document.getElementById('lootTarget').value;
      const desc = document.getElementById('lootDesc').value;

      let targetName = 'Усе паті';
      if (targetId !== 'all') {
        const p = players.find(player => player.id === targetId);
        if (p) targetName = p.name;
      }

      addLogMessage(`DM видав [${name}] ➔ ${targetName}`, 'loot');
      
      // Reset form
      document.getElementById('lootName').value = '';
      document.getElementById('lootDesc').value = '';
      alert(`Предмет "${name}" успішно відправлено: ${targetName}`);
    }

    // Distribute Coins
    function distributeCoins(mode) {
      const gp = parseInt(document.getElementById('grantGP').value) || 0;
      const sp = parseInt(document.getElementById('grantSP').value) || 0;
      const cp = parseInt(document.getElementById('grantCP').value) || 0;

      if (gp === 0 && sp === 0 && cp === 0) return;

      const count = players.length;
      if (mode === 'divided') {
        addLogMessage(`DM розділив майно між паті: ${Math.floor(gp/count)}GP, ${Math.floor(sp/count)}SP, ${Math.floor(cp/count)}CP кожному`, 'loot');
      } else {
        addLogMessage(`DM видав кожному гравцю по: ${gp}GP, ${sp}SP, ${cp}CP`, 'loot');
      }

      document.getElementById('grantGP').value = 0;
      document.getElementById('grantSP').value = 0;
      document.getElementById('grantCP').value = 0;
    }

    // Whispering
    function sendWhisper() {
      const targetId = document.getElementById('whisperTarget').value;
      const text = document.getElementById('whisperText').value;

      if (!text.trim()) return;

      const player = players.find(p => p.id === targetId);
      addLogMessage(`DM 🔒 [Секрет для ${player.name}]: "${text}"`, 'whisper');
      
      document.getElementById('whisperText').value = '';
    }

    // Logging Utility
    function addLogMessage(msg, type = 'info') {
      const logContainer = document.getElementById('activityLog');
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      let colorClass = 'text-gray-400';
      if (type === 'action') colorClass = 'text-amber-400';
      if (type === 'loot') colorClass = 'text-emerald-400';
      if (type === 'whisper') colorClass = 'text-purple-400';
      if (type === 'system') colorClass = 'text-blue-400';

      const item = document.createElement('div');
      item.className = 'border-b border-gray-800/60 pb-1';
      item.innerHTML = `<span class="text-gray-600 text-[10px]">[${time}]</span> <span class="${colorClass}">${msg}</span>`;
      
      logContainer.appendChild(item);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function clearLog() {
      document.getElementById('activityLog').innerHTML = '';
    }

    function copySessionLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Посилання на ігрову сесію скопійовано!");
    }
  </script>
</body>
</html>
