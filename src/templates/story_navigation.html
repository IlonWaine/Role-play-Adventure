<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Nexus Hub - Історії DM</title>
    <link rel="stylesheet" href="css/player_navigation.css">
    <!--
      Тимчасовий fallback-стиль (аналогічно player_navigation.html),
      поки немає окремого story_navigation.css.
    -->
    <style>
        .player-actions { margin: 0.5rem 0; }
        .btn-add-char {
            cursor: pointer;
            padding: 0.4rem 0.9rem;
            border: 1px dashed #888;
            border-radius: 6px;
            background: transparent;
            font-size: 0.85rem;
        }
        .btn-add-char:hover { background: rgba(0,0,0,0.05); }
        .character-card-link { cursor: pointer; }
        .character-card-link:hover { background: rgba(0,0,0,0.05); }
        .new-story-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .new-story-row input { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Історії Dungeon Master'a</h1>
            <button id="logoutBtn" class="btn-secondary">Вийти</button>
        </header>

        <section class="forms-section">
            <div class="card">
                <h3>Створити нову історію</h3>
                <form id="addStoryForm" class="new-story-row">
                    <input type="text" id="storyTitleInput" placeholder="Назва історії" required>
                    <button type="submit" class="btn-primary">+ Створити</button>
                </form>
            </div>
        </section>

        <section class="list-section">
            <h2>Ваші Історії</h2>
            <div id="storiesList" class="accordion-list"></div>
        </section>
    </div>

    <script src="js/story_navigation.js"></script>
</body>
</html>
