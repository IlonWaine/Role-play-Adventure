<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Nexus Hub - Кабінет DM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/player_navigation.css">
</head>
<body>
    <div class="container">

        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-dice-d20"></i>
                <span class="brand-text">D&D <span>Nexus</span> Hub</span>
            </div>
            <div class="top-bar-actions">
                <button class="btn-icon" onclick="window.location.href='/?menu=1'" title="До меню"><i class="fa-solid fa-arrow-left"></i></button>
                <button id="logoutBtn" class="btn-icon danger" title="Вийти з акаунту"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <nav class="tab-strip">
            <a href="/player_navigation" class="active"><i class="fa-solid fa-gauge"></i> Панель</a>
            <a href="/story_navigation"><i class="fa-solid fa-book-open"></i> Історії</a>
            <a href="/session_setup"><i class="fa-solid fa-play"></i> Сесії</a>
        </nav>

        <h1 class="page-title">Панель Dungeon Master'а</h1>
        <p class="page-subtitle">Керуйте гравцями та їхніми персонажами</p>

        <section class="forms-section">
            <div class="card">
                <div class="card-label">Додати гравця</div>
                <form id="addPlayerForm" class="inline-form">
                    <input type="text" id="playerNameInput" placeholder="Ім'я гравця" required>
                    <button type="submit" class="btn-gold"><i class="fa-solid fa-plus"></i> Створити</button>
                </form>
            </div>
        </section>

        <section class="list-section">
            <div class="section-label">Ваші гравці та персонажі</div>
            <div id="playersList"></div>
        </section>

        <footer class="page-footer">D&D Nexus Hub — панель Dungeon Master</footer>
    </div>

    <script src="js/player_navigation.js"></script>
</body>
</html>
