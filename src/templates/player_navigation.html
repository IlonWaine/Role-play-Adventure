<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Nexus Hub - Кабінет DM</title>
    <link rel="stylesheet" href="css/player_navigation.css">
    <!--
      Тимчасовий fallback-стиль для нових елементів (player-actions / btn-add-char /
      character-card-link), яких ще немає у player_navigation.css.
      Якщо додасте ці класи у свій CSS-файл — цей блок можна видалити.
    -->
    <style>
        .player-actions { margin: 0.5rem 0; }
        .btn-add-char {
            cursor: pointer;
            padding: 0.4rem 0.9rem;
            border: 1px dashed #888;
            border-radius: 6px;
            background: transparent;
            font-size: 0.85rem;
        }
        .btn-add-char:hover { background: rgba(0,0,0,0.05); }
        .character-card-link { cursor: pointer; }
        .character-card-link:hover { background: rgba(0,0,0,0.05); }
        .player-code-badge {
            font-size: 0.75rem;
            font-weight: normal;
            opacity: 0.7;
            margin-left: 0.4rem;
        }
        .character-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-delete-inline {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0.6;
        }
        .btn-delete-inline:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Панель Dungeon Master</h1>
            <button id="logoutBtn" class="btn-secondary">Вийти</button>
        </header>

        <section class="forms-section">
            <div class="card">
                <h3>Додати Гравця</h3>
                <form id="addPlayerForm">
                    <input type="text" id="playerNameInput" placeholder="Ім'я гравця" required>
                    <button type="submit" class="btn-primary">Створити</button>
                </form>
            </div>
        </section>

        <section class="list-section">
            <h2>Ваші Гравці та Персонажі</h2>
            <div id="playersList" class="accordion-list">
                </div>
        </section>
    </div>

    <script src="js/player_navigation.js"></script>
</body>
</html>
